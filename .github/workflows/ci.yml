name: RuiWen CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 并发控制：同一分支/PR 的新运行会取消旧的，避免重复部署与资源浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # ── 后端：编译（跳过依赖真实 DB/Redis/短信的测试） ──────────────────────
  backend:
    name: Backend compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache Maven local repo
        uses: actions/cache@v4
        with:
          path: backend/.mvn/repository
          key: maven-${{ hashFiles('backend/pom.xml', 'backend/.mvn/maven.config') }}
          restore-keys: maven-

      - name: Compile (skip tests)
        run: mvn -B -DskipTests compile

  # ── 前端：lint + 构建 ────────────────────────────────────────────────
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── 构建镜像 + 推送到服务器部署（仅 main 分支 / 手动触发） ─────────────
  build:
    name: Build images & deploy
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 同一分支同时只跑一个部署，且保留最近一次、取消正在进行的旧部署
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    env:
      DOCKER_PLATFORM: linux/amd64
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
      DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-platform build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify deploy hook credentials
        run: |
          if [ -z "${DEPLOY_SECRET}" ]; then
            echo "::error::DEPLOY_SECRET secret is not configured in this repository. Deploy aborted."
            exit 1
          fi
          echo "Deploy hook URL: ${DEPLOY_HOOK_URL:-<not set, script will default to localhost>}"

      - name: Build images & deploy via release hook
        run: scripts/deploy_release_hook.sh "${{ github.sha }}"
