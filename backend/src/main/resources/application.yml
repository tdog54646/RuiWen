server:
  port: ${SERVER_PORT:58080}
  tomcat:
    threads:
      max: 800                          # 提升并发处理线程数
      min-spare: 100                    # 初始活跃线程
    max-connections: 10000              # 最大支持的 TCP 连接
    accept-count: 1000                  # 队列深度
spring:
  application:
    name: ruiwen-auth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ruiwen?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:7By6JOUx6gM0MJTSAW35YJZ4s3fAhEbRlFq8smszmE6wsFjf}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50             # 连接池最大连接数
      minimum-idle: 30                   # 最小空闲连接
      idle-timeout: 600000              # 10 分钟：空闲多久回收
      max-lifetime: 1700000             # 约 28 分钟
      keepalive-time: 300000            # 5 分钟发一次“保活”
      connection-timeout: 10000         # 30 秒拿不到连接就报错
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:DLlmjIqnQ5YZCdXc3NfBHalC6mRMihq7vO98n4rWehKOIfqF}
      lettuce:
        pool:
          max-active: 100               # 最大活跃连接数
          max-idle: 50                  # 最大空闲连接
          min-idle: 10                  # 最小空闲连接
          max-wait: 3000ms              # 获取连接等待超时
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      default-topic: counter-events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      linger: 10ms
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: counter-agg
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      type: single
      ack-mode: manual
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
          temperature: ${DEEPSEEK_TEMPERATURE:0.8}
    openai:
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-v4} # 向量模型
          dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
    vectorstore:
      elasticsearch:
        initialize-schema: ${VECTORSTORE_INITIALIZE_SCHEMA:true}
        index-name: ${VECTORSTORE_INDEX_NAME:ruiwen-ai-index}
        dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536} # 一定要和上面的 dimensions 一致，不然会报错
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9201}

canal:
  enabled: ${CANAL_ENABLED:true}
  host: ${CANAL_HOST:localhost}
  port: ${CANAL_PORT:11111}
  destination: ${CANAL_DESTINATION:example}
  username: ${CANAL_USERNAME:canal}
  password: ${CANAL_PASSWORD:C7vL2pQ9xM4sT8zN5yK3wH6rA1dE0}
  filter: ${CANAL_FILTER:ruiwen\.outbox}
  batchSize: ${CANAL_BATCH_SIZE:1000}
  intervalMs: ${CANAL_INTERVAL_MS:1000}

counter:
  rebuild:
    enabled: false
    lock:
      ttl-ms: 5000
      watchdog-ms: 30000
    rate:
      permits: 3
      window-seconds: 10
    backoff:
      base-ms: 500
      max-ms: 30000

leaderboard:
  top-n-max-size: 10000
  top-query-limit-max: 200
  batch-limit: 200
  segment-min-score: 1
  segment-max-score: 100000
  segment-bucket-size: 100
  dedup-ttl: PT48H

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

auth:
  jwt:
    issuer: ruiwen
    key-id: ruiwen-key
    private-key: classpath:keys/private.pem
    public-key: classpath:keys/public.pem
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  verification:
    code-length: 6
    ttl: PT5M
    max-attempts: 5
    send-interval: PT60S
    daily-limit: 10
  password:
    bcrypt-strength: 12
    min-length: 8

# ---------------------------------------------------------------------------
# 后台管理：首个超级管理员引导。启动时若 identifier 对应用户存在则提升为 SUPER_ADMIN。
# 可用手机号或邮箱（按邮箱优先、其次手机号匹配）。也可用 deploy/mysql/migration-admin.sql 手动提升。
# ---------------------------------------------------------------------------
admin:
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    identifier: ${ADMIN_BOOTSTRAP_IDENTIFIER:}

logging:
  level:
    root: INFO
    '[com.tongji]': DEBUG

oss:
  endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket: ${OSS_BUCKET:}
  public-domain: ${OSS_PUBLIC_DOMAIN:}
  folder: ${OSS_FOLDER:avatars}

cache:
  l2:
    public-cfg:
      ttl-seconds: 15
      max-size: 1000
    mine-cfg:
      ttl-seconds: 10
      max-size: 1000
  hotkey:
    window-seconds: 60
    segment-seconds: 10
    level-low: 50
    level-medium: 200
    level-high: 500
    extend-low-seconds: 20
    extend-medium-seconds: 60
    extend-high-seconds: 120
code:
  send:
    guo-yang:
      code-key: ${GUO_YANG_CODE_KEY:}

# ---------------------------------------------------------------------------
# RAG（检索增强生成）配置
# 对应 RagProperties 中的字段
# ---------------------------------------------------------------------------
rag:
  chunk:
    size: 500          # 每个 Chunk 的最大 token 数
    overlap: 50        # 相邻 Chunk 之间的重叠 token 数
    min-length: 0     # 丢弃字符数少于该值的 Chunk
    max-length: 2000   # 丢弃字符数多于该值的 Chunk
    # ── Markdown 结构感知切分（mode B / mode A）─────────────────────────────
    markdown-aware: true      # 启用结构感知（false 退化为原有 TokenTextSplitter 逻辑）
    mode: rule               # rule=纯规则（推荐），llm=LLM 增强（DeepSeek 调用）
    header-anchoring: true   # 标题与紧随内容合并（rule 模式生效）
  retrieval:
    top-k: 20          # 每路检索（向量路 / BM25 路）各自召回的 Top 数量
    min-score: 0.0     # Chunk 最低相似度阈值（低于此值不纳入 RRF 结果）
  rrf:
    k: 60              # RRF 平滑常数。K 越大各路影响力越均衡。RAGFlow 默认 60。
  rerank:
    enabled: false     # 是否启用 Reranker 精排（默认关闭；接入 BGE-Reranker 等模型时开启）
    top-k: 20          # RRF 后送入精排的候选数量（精排开销大，通常 10~20）
    # api-url: http://localhost:8000/rerank   # 精排服务地址（enabled=true 时必填）
    # api-key: xxxxxx                          # 精排 API Key（可选）
  prompt:
    context-limit: 5   # 最终送入 LLM 的最大 Chunk 数量（控制 Prompt 长度）
    empty-answer: "未找到相关信息，请尝试调整问题的表述，或换一种问法。"  # 检索为空时的兜底文案

# ---------------------------------------------------------------------------
# 多轮问答（qa）配置
# 对应 QaProperties 中的字段
# ---------------------------------------------------------------------------
qa:
  history-window: 6          # 携带最近 N 轮历史（一轮=user+assistant）
  memory:
    update-threshold: 8      # 每累计 N 条新消息触发一次自动记忆更新
    summary-window: 20       # 记忆总结时回看最近 N 条消息
    summary-max-tokens: 1024 # 记忆总结 LLM 最大生成 token 数
  chat:
    default-top-k: 5         # 默认 RAG 检索 Chunk 数量上限
    default-max-tokens: 1024 # 默认 LLM 最大生成 token 数

# ── 知文导出 PDF ──────────────────────────────────────────────────────
# 中文字体查找路径：按顺序取第一个存在的文件注册为 font-family。
# 容器（Alpine font-noto-cjk）与本地开发（macOS）路径均已内置默认值，通常无需修改。
app:
  pdf:
    font-family: RuiWen
    image-fetch-timeout-seconds: 5
    # font-search-paths:
    #   - /usr/share/fonts/noto/NotoSansCJKsc-Regular.otf
    #   - /System/Library/Fonts/Supplemental/Arial Unicode.ttf

kind: Application
