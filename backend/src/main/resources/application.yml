server:
  port: ${SERVER_PORT:58080}
  tomcat:
    threads:
      max: 800                          # 提升并发处理线程数
      min-spare: 100                    # 初始活跃线程
    max-connections: 10000              # 最大支持的 TCP 连接
    accept-count: 1000                  # 队列深度

spring:
  # 虚拟线程：Tomcat 请求线程、@Async、MVC 异步（SSE）等阻塞型任务改用虚拟线程，
  # 配合下方 AsyncConfig 显式设置 MVC 异步 executor，消除 SimpleAsyncTaskExecutor 警告。
  threads:
    virtual:
      enabled: true
  application:
    name: ruiwen-auth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ruiwen?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:7By6JOUx6gM0MJTSAW35YJZ4s3fAhEbRlFq8smszmE6wsFjf}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50             # 连接池最大连接数
      minimum-idle: 30                   # 最小空闲连接
      idle-timeout: 600000              # 10 分钟：空闲多久回收
      max-lifetime: 1700000             # 约 28 分钟
      keepalive-time: 300000            # 5 分钟发一次“保活”
      connection-timeout: 10000         # 30 秒拿不到连接就报错
      data-source-properties:
        # 幂等状态迁移依赖实际变更行数，禁用 CLIENT_FOUND_ROWS 语义。
        useAffectedRows: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:DLlmjIqnQ5YZCdXc3NfBHalC6mRMihq7vO98n4rWehKOIfqF}
      lettuce:
        pool:
          max-active: 100               # 最大活跃连接数
          max-idle: 50                  # 最大空闲连接
          min-idle: 10                  # 最小空闲连接
          max-wait: 3000ms              # 获取连接等待超时
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      default-topic: counter-events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      linger: 10ms
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: counter-agg
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      type: single
      ack-mode: manual
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
          temperature: ${DEEPSEEK_TEMPERATURE:0.8}
    openai:
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-v4} # 向量模型
          dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
    vectorstore:
      elasticsearch:
        # RAG 索引由 RagIndexManager 以版本化 mapping 创建；禁止 Spring AI 抢先创建默认 Standard Analyzer 索引。
        initialize-schema: ${VECTORSTORE_INITIALIZE_SCHEMA:false}
        index-name: ${VECTORSTORE_INDEX_NAME:ruiwen-ai-read}
        dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536} # 一定要和上面的 dimensions 一致，不然会报错
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9201}

canal:
  enabled: ${CANAL_ENABLED:true}
  host: ${CANAL_HOST:localhost}
  port: ${CANAL_PORT:11111}
  destination: ${CANAL_DESTINATION:example}
  username: ${CANAL_USERNAME:canal}
  password: ${CANAL_PASSWORD:C7vL2pQ9xM4sT8zN5yK3wH6rA1dE0}
  filter: ${CANAL_FILTER:ruiwen\.outbox}
  batchSize: ${CANAL_BATCH_SIZE:1000}
  intervalMs: ${CANAL_INTERVAL_MS:1000}

counter:
  rebuild:
    enabled: false
    lock:
      ttl-ms: 5000
      watchdog-ms: 30000
    rate:
      permits: 3
      window-seconds: 10
    backoff:
      base-ms: 500
      max-ms: 30000

leaderboard:
  top-n-max-size: 10000
  top-query-limit-max: 200
  batch-limit: 200
  segment-min-score: 1
  segment-max-score: 100000
  segment-bucket-size: 100
  dedup-ttl: PT48H

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

auth:
  jwt:
    issuer: ruiwen
    key-id: ruiwen-key
    private-key: classpath:keys/private.pem
    public-key: classpath:keys/public.pem
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  verification:
    code-length: 6
    ttl: PT5M
    max-attempts: 5
    send-interval: PT60S
    daily-limit: 10
  password:
    bcrypt-strength: 12
    min-length: 8
  oauth:
    google:
      # Google OAuth Client ID，用于校验前端传来的 ID Token（audience）
      client-id: ${GOOGLE_CLIENT_ID:}
      # Google JWKS 地址，默认官方；国内服务器若走自建反代可覆盖
      jwks-uri: ${GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
      proxy:
        # 出墙代理（国内服务器拉 Google 公钥用）；host 为空则直连
        host: ${GOOGLE_PROXY_HOST:}
        port: ${GOOGLE_PROXY_PORT:0}
        type: ${GOOGLE_PROXY_TYPE:HTTP}

# ---------------------------------------------------------------------------
# 后台管理：首个超级管理员引导。启动时若 identifier 对应用户存在则提升为 SUPER_ADMIN。
# 可用手机号或邮箱（按邮箱优先、其次手机号匹配）。也可用 deploy/mysql/migration-admin.sql 手动提升。
# ---------------------------------------------------------------------------
admin:
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    identifier: ${ADMIN_BOOTSTRAP_IDENTIFIER:}

logging:
  level:
    root: INFO
    '[com.tongji]': DEBUG

oss:
  endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket: ${OSS_BUCKET:}
  public-domain: ${OSS_PUBLIC_DOMAIN:}
  folder: ${OSS_FOLDER:avatars}
  read-url-ttl-seconds: ${OSS_READ_URL_TTL_SECONDS:3600}
  # 历史对象 ACL 的一次性迁移开关；迁移时显式启用，完成后关闭，避免每次重启全量扫描。
  acl-reconcile-on-startup: ${OSS_ACL_RECONCILE_ON_STARTUP:false}
  max-post-content-bytes: ${OSS_MAX_POST_CONTENT_BYTES:2097152}
  max-image-bytes: ${OSS_MAX_IMAGE_BYTES:10485760}

cache:
  l2:
    public-cfg:
      ttl-seconds: 15
      max-size: 1000
    mine-cfg:
      ttl-seconds: 10
      max-size: 1000
  hotkey:
    window-seconds: 60
    segment-seconds: 10
    level-low: 50
    level-medium: 200
    level-high: 500
    extend-low-seconds: 20
    extend-medium-seconds: 60
    extend-high-seconds: 120
code:
  send:
    guo-yang:
      code-key: ${GUO_YANG_CODE_KEY:}

# ---------------------------------------------------------------------------
# RAG（检索增强生成）配置
# 对应 RagProperties 中的字段
# ---------------------------------------------------------------------------
rag:
  index:
    # 线上读写永远访问稳定别名；升级时先构建物理版本索引，再原子切换别名。
    alias: ${RAG_INDEX_ALIAS:ruiwen-ai-read}
    legacy-name: ${RAG_INDEX_LEGACY_NAME:ruiwen-ai-index}
    version: ${RAG_INDEX_VERSION:2}
    dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
    analyzer: ${RAG_INDEX_ANALYZER:ik_max_word}
    search-analyzer: ${RAG_INDEX_SEARCH_ANALYZER:ik_smart}
  chunk:
    size: 500          # 每个 Chunk 的最大 token 数
    overlap: 50        # 相邻 Chunk 之间的重叠 token 数
    min-length: 0     # 丢弃字符数少于该值的 Chunk
    max-length: 2000   # 丢弃字符数多于该值的 Chunk
    # ── Markdown 结构感知切分（mode B / mode A）─────────────────────────────
    markdown-aware: true      # 启用结构感知（false 退化为原有 TokenTextSplitter 逻辑）
    mode: rule               # rule=纯规则（推荐），llm=LLM 增强（DeepSeek 调用）
    header-anchoring: true   # 标题与紧随内容合并（rule 模式生效）
  retrieval:
    top-k: ${RAG_RETRIEVAL_TOP_K:20}                  # 当前 281 文档实测 20 与 40 的 Recall@20 无收益差异
    knn-candidates: ${RAG_KNN_CANDIDATES:50}          # 50 与 100 质量完全一致，取更小候选池降低 HNSW 开销
    min-score: ${RAG_RRF_MIN_SCORE:0.0}               # 这是 RRF 分数，不是 0~1 相似度；默认不做错误阈值过滤
    title-boost: ${RAG_BM25_TITLE_BOOST:1.0}
    phrase-boost: ${RAG_BM25_PHRASE_BOOST:0.0}
    phrase-slop: ${RAG_BM25_PHRASE_SLOP:0}
    minimum-should-match: ${RAG_BM25_MINIMUM_SHOULD_MATCH:1}
    query-type: ${RAG_BM25_QUERY_TYPE:best_fields}
    fuzziness: ${RAG_BM25_FUZZINESS:NONE}
    diversity-enabled: ${RAG_CONTEXT_DIVERSITY_ENABLED:true}
    near-duplicate-threshold: ${RAG_NEAR_DUPLICATE_THRESHOLD:0.65}
  rrf:
    k: ${RAG_RRF_K:20} # v2 SILVER 网格实测与 60 召回相同，Top5 冗余更低
  rerank:
    enabled: ${RAG_RERANK_ENABLED:false}
    top-k: ${RAG_RERANK_TOP_K:20}
    api-url: ${RAG_RERANK_API_URL:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
    model: ${RAG_RERANK_MODEL:gte-rerank-v2}
    api-key: ${RAG_RERANK_API_KEY:${DASHSCOPE_API_KEY:}}
    min-score: ${RAG_RERANK_MIN_SCORE:0.0}            # 分数仅在同一次请求内相对可比，先通过评测再校准
    fail-open: ${RAG_RERANK_FAIL_OPEN:true}           # 精排不可用时保留 RRF 结果，避免问答整体不可用
    connect-timeout-ms: ${RAG_RERANK_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${RAG_RERANK_READ_TIMEOUT_MS:10000}
  prompt:
    context-limit: 8   # DEV 网格锁定的最终上下文数量
    empty-answer: "未找到相关信息，请尝试调整问题的表述，或换一种问法。"  # 检索为空时的兜底文案
  evaluation:
    parallelism: ${RAG_EVALUATION_PARALLELISM:1}
    reviewed-only: true
    candidate-k: 20
    final-k: 8
    retrieval-top-k-grid: [20, 40]
    knn-candidates-grid: [50, 100]
    final-top-k-grid: [3, 5, 8]
    rrf-k-grid: [20]
    title-boost-grid: [1.0]
    phrase-boost-grid: [0.0]
    near-duplicate-threshold-grid: [0.35, 0.45, 0.55, 0.65]
    # 仅供离线 SILVER 相关性标注；与线上 DeepSeek 问答模型完全隔离。
    judge-api-url: ${RAG_EVALUATION_JUDGE_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    judge-model: ${RAG_EVALUATION_JUDGE_MODEL:qwen-plus}
    judge-api-key: ${RAG_EVALUATION_JUDGE_API_KEY:${DASHSCOPE_API_KEY:${OPENAI_API_KEY:}}}
    judge-timeout-seconds: ${RAG_EVALUATION_JUDGE_TIMEOUT_SECONDS:45}
    judge-max-tokens: ${RAG_EVALUATION_JUDGE_MAX_TOKENS:4096}
    judge-fallback-enabled: ${RAG_EVALUATION_JUDGE_FALLBACK_ENABLED:true}

# ---------------------------------------------------------------------------
# 多轮问答（qa）配置
# 对应 QaProperties 中的字段
# ---------------------------------------------------------------------------
qa:
  history-window: 6          # 携带最近 N 轮历史（一轮=user+assistant）
  memory:
    update-threshold: 8      # 每累计 N 条新消息触发一次自动记忆更新
    summary-window: 20       # 记忆总结时回看最近 N 条消息
    summary-max-tokens: 1024 # 记忆总结 LLM 最大生成 token 数
  chat:
    default-top-k: 5         # 默认 RAG 检索 Chunk 数量上限
    default-max-tokens: 8192 # 默认 LLM 最大生成 token 数（DeepSeek 常见输出上限）

# ---------------------------------------------------------------------------
# 语音转文字（ASR）配置 —— 对应 AsrProperties
# 实时流式：DashScope paraformer-realtime-v2 WebSocket（独立于 OPENAI_*）
# ---------------------------------------------------------------------------
asr:
  api-key: ${DASHSCOPE_ASR_API_KEY:}
  ws-url: ${ASR_WS_URL:wss://dashscope.aliyuncs.com/api-ws/v1/inference/}
  model: ${ASR_MODEL:paraformer-realtime-v2}

# ---------------------------------------------------------------------------
# 图片识别（视觉模型）配置 -- 对应 VisionProperties
# 默认接入阿里云百炼 QVQ 视觉推理模型（OpenAI 兼容、流式）。
# api-key 默认回退到 OPENAI_API_KEY（同一 DashScope 账号即可调用 QVQ）。
# ---------------------------------------------------------------------------
vision:
  api-key: ${DASHSCOPE_API_KEY:${OPENAI_API_KEY:}}
  base-url: ${QVQ_BASE_URL:https://llm-ciuhew9j1jjrvz3f.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
  model: ${QVQ_MODEL:qvq-plus}
  max-tokens: 1024
  timeout-seconds: 120

# ── 知文导出 PDF ──────────────────────────────────────────────────────
# 中文字体查找路径：按顺序取第一个存在的文件注册为 font-family。
# 容器（Alpine font-noto-cjk）与本地开发（macOS）路径均已内置默认值，通常无需修改。
app:
  pdf:
    font-family: RuiWen
    image-fetch-timeout-seconds: 5
    max-image-bytes: ${PDF_MAX_IMAGE_BYTES:5242880}
    max-remote-images: ${PDF_MAX_REMOTE_IMAGES:20}
    max-embedded-image-bytes-total: ${PDF_MAX_EMBEDDED_IMAGE_BYTES_TOTAL:20971520}
    max-image-redirects: ${PDF_MAX_IMAGE_REDIRECTS:3}
    # OSS 域名自动允许；其他远程图片按需配置逗号分隔的可信域名。
    allowed-image-hosts: ${PDF_ALLOWED_IMAGE_HOSTS:}
    # font-search-paths:
    #   - /usr/share/fonts/noto/NotoSansCJKsc-Regular.otf
    #   - /System/Library/Fonts/Supplemental/Arial Unicode.ttf

kind: Application
